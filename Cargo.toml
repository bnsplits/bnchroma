[package]
name = "bnchroma"
version = "0.2.1"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
dirs = "7.0.0"
image = { version = "0.25.5", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "webp",
] }
serde = { version = "1.0", features = ["derive"] }
shellexpand = "3.0"
toml = "1.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
